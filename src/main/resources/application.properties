spring.application.name=famicare-backend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/famicare_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.famicare.FamicareBackend.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicNamingStrategy

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

subscriptions.expiration-check-ms=${SUBSCRIPTIONS_EXPIRATION_CHECK_MS:60000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
