spring.application.name=famicare-backend

# --- MySQL (override with environment variables DB_URL, DB_USER, DB_PASSWORD) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/famicare?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=com.famicare.FamicareBackend.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicNamingStrategy

# --- Messages (messages.properties = Spanish default, messages_en.properties = English) ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
